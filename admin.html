<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080b">
<title>ItzSmokePoint · Admin</title>
<link rel="preconnect" href="https://uzkusblmtvzjvulbgdav.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
:root{
  --bg:#08080b;--card:#111118;--card2:#17151e;--text:#f6f3fa;--muted:#aaa4b5;
  --purple:#9b5dff;--purple2:#7134c7;--border:#2b2637;--ok:#9de0b0;--danger:#ff9292
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
body{
  position:relative;
  background:
    radial-gradient(ellipse 55% 30% at 50% -8%,rgba(137,79,226,.16),transparent 68%),
    radial-gradient(ellipse 35% 26% at 85% 80%,rgba(174,138,245,.05),transparent 72%),
    #08080b;
  background-attachment:fixed;
}
*{-webkit-tap-highlight-color:transparent}
button{font:inherit;-webkit-tap-highlight-color:transparent;outline:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
input,textarea{-webkit-tap-highlight-color:transparent;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(155,93,255,.15)}
.wrap{max-width:1250px;margin:auto;padding:0 16px}

@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes brandIn{from{opacity:0;transform:translateY(-14px) rotate(-6deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes flameFlicker{0%,100%{transform:scale(1) rotate(0deg);opacity:.85}50%{transform:scale(1.1) rotate(3deg);opacity:1}}
@keyframes glowPulse{0%,100%{opacity:.22}50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;transition-delay:0s!important}
}

header{
  position:sticky;top:0;z-index:30;
  background:rgba(10,9,14,.62);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid transparent;
  transition:border-color .25s ease, box-shadow .25s ease, background .25s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:rgba(8,8,11,.97)}
}
header.scrolled{border-bottom-color:var(--border);box-shadow:0 10px 24px rgba(0,0,0,.28);background:rgba(10,9,14,.82)}
.nav{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.brandHero{display:flex;justify-content:center;align-items:center;text-align:center}
.brandWrap{display:inline-flex;flex-direction:column;align-items:center}
.brandFlame{width:18px;height:18px;fill:var(--purple);margin-bottom:1px;transform-origin:50% 90%;animation:flameFlicker 1.7s ease-in-out infinite}
.brandText{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;transform:skewX(-8deg)}
.brandText span,.brandText b,.brandText strong{
  font-family:'Anton',Impact,'Arial Narrow',sans-serif;
  font-size:clamp(22px,6vw,34px);font-weight:400;letter-spacing:.5px;display:inline-block;
}
.brandText span{color:#fff;animation:brandIn .5s cubic-bezier(.22,.9,.32,1) both}
.brandText b{color:var(--purple);position:relative;margin:0 2px;animation:brandIn .5s cubic-bezier(.22,.9,.32,1) .08s both}
.brandText b::after{content:"";position:absolute;left:2%;right:2%;bottom:6%;height:55%;background:var(--purple);filter:blur(14px);opacity:.3;z-index:-1;animation:glowPulse 3.4s ease-in-out infinite}
.brandText strong{color:#fff;animation:brandIn .5s cubic-bezier(.22,.9,.32,1) .16s both}
.adminTag{margin-top:3px;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}

main{padding:22px 0 70px}
main.wrap{max-width:1250px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:6px 0 20px}
.searchInput{flex:1 1 220px;max-width:320px;background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:10px;padding:11px 14px}
.primary{background:var(--purple);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;transition:background .15s ease,transform .12s ease,box-shadow .15s ease}
.primary:hover{background:#a76dff;box-shadow:0 8px 20px rgba(155,93,255,.3)}
.primary:active{transform:scale(.97)}
.secondary{background:var(--card2);color:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:700;transition:border-color .15s ease,transform .12s ease}
.secondary:hover{border-color:rgba(178,132,255,.5)}
.secondary:active{transform:scale(.97)}

.panel{
  background:linear-gradient(145deg,rgba(46,40,62,.5),rgba(16,15,22,.55));
  backdrop-filter:blur(12px) saturate(150%);
  -webkit-backdrop-filter:blur(12px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:20px;margin-bottom:20px;
  animation:cardIn .35s ease both;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel{background:linear-gradient(145deg,rgba(35,30,47,.94),rgba(12,12,18,.97))}
}
.panel h3{margin:0 0 16px;text-align:center;font-size:17px}
.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.settingField label{display:grid;gap:6px;color:var(--muted);font-size:13px;margin-bottom:8px}
.settingField input{width:100%;background:#0b0b10;color:#fff;border:1px solid var(--border);border-radius:8px;padding:10px}
.fieldActions{display:flex;gap:8px}
.hint{color:var(--muted);font-size:12px}
.panel>.hint{text-align:center;margin-top:12px;margin-bottom:0}

.brandsList{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.brandRow{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  background:rgba(15,14,20,.5);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  transition:box-shadow .3s ease, opacity .2s ease;
}
.brandRow.inactive{opacity:.55}
.brandRow.justSaved{box-shadow:0 0 0 2px var(--purple),0 0 20px rgba(155,93,255,.3)}
.f-brandname{flex:1 1 160px;min-width:0;background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 10px;font-weight:700}
.brandPriceGroup{display:flex;align-items:center;gap:8px;flex:none}
.f-brandprice{width:110px}
.brandMeta{display:flex;align-items:center;gap:14px;flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap}
.brandsFoot{margin-top:14px;text-align:center}
.secondary.small,.delete.small{padding:8px 12px;font-size:13px}
.f-brand{width:100%;background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 10px}

.summary{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{
  content-visibility:auto;
  contain-intrinsic-size:320px 520px;
  background:linear-gradient(145deg,rgba(46,40,62,.5),rgba(16,15,22,.55));
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;
  transition:box-shadow .3s ease, opacity .18s ease, transform .18s ease;
  animation:cardIn .35s ease both;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .pcard{background:linear-gradient(145deg,rgba(35,30,47,.94),rgba(12,12,18,.97))}
}
.pcard.inactive{opacity:.55}
.pcard.justSaved{box-shadow:0 0 0 2px var(--purple),0 0 24px rgba(155,93,255,.35)}
.pcard.removing{opacity:0;transform:scale(.95)}
.pcard.hide{display:none}

.imgWrap{position:relative;height:190px;border-radius:13px;background:linear-gradient(145deg,rgba(8,8,13,.9),rgba(22,18,31,.75));border:1px dashed rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .2s ease,background .2s ease}
.imgWrap.drag{border-color:var(--purple);background:rgba(155,93,255,.1)}
.imgWrap img{width:100%;height:100%;object-fit:contain}
.imgWrap .ph{color:#6d6579;font-size:13px}
.imgEdit{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(10,9,14,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.15);transition:background .15s ease,transform .15s ease;color:#fff}
.imgEdit:hover{background:var(--purple)}
.imgEdit:active{transform:scale(.9)}
.imgRemove{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(25,10,10,.72);color:#ffb3b3;border:1px solid rgba(255,140,140,.32);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.imgRemove:active{transform:scale(.9)}

.pcardTop{display:flex;align-items:center;gap:8px}
.f-name{flex:1;min-width:0;background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 10px;font-weight:700}

.badge-ok,.badge-bad{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.2px;flex:none;white-space:nowrap}
.badge-ok::before,.badge-bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-ok{background:rgba(120,220,160,.14);color:#8be8ab;border:1px solid rgba(120,220,160,.35)}
.badge-bad{background:rgba(255,110,110,.13);color:#ff9c9c;border:1px solid rgba(255,110,110,.35)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.f-num{width:100%;background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:8px;padding:8px}
.fLabel{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.f-desc,.f-feat{background:#0b0b10;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px;resize:vertical;font-family:inherit}
.f-desc{min-height:64px}
.f-feat{min-height:78px}

.pcardFoot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggleTrack{width:38px;height:22px;background:#2a2635;border-radius:99px;position:relative;transition:background .2s ease;flex:none}
.toggleThumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s cubic-bezier(.22,.9,.32,1)}
.toggle input:checked+.toggleTrack{background:var(--purple)}
.toggle input:checked+.toggleTrack .toggleThumb{transform:translateX(16px)}
.toggle input:focus-visible+.toggleTrack{outline:2px solid var(--purple);outline-offset:2px}
.delete{background:#2a1117;color:#ffb3b3;border:1px solid #57202b;border-radius:9px;padding:9px 12px;font-weight:700;transition:background .15s ease,transform .12s ease}
.delete:hover{background:#3a1620}
.delete:active{transform:scale(.95)}

.authPanel{max-width:420px;margin:50px auto;text-align:center}
.authForm{display:grid;gap:10px;margin-top:14px}
.authForm input{background:#0b0b10;color:#fff;border:1px solid var(--border);border-radius:8px;padding:11px}

.emptyState{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:rgba(20,16,30,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .wrap{padding:0 12px}
  .pgrid{grid-template-columns:1fr}
  .panel{padding:16px}
}
</style>
</head>
<body>
<header>
<div class="wrap nav">
  <span aria-hidden="true"></span>
  <div class="brandHero">
    <div class="brandWrap">
      <svg class="brandFlame" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2c1.2 2.6-1.6 4.1-1.9 6.7-.2 1.7.9 2.6 2 2.6.9 0 1.9-.7 1.7-2-.1-.6.2-.7.6-.2.9 1.1 1.1 2.6.2 3.8-1.3 1.7-3.9 1.8-5.4.2-1.9-2-1.7-4.8-.2-7C10 4.6 11.3 3.3 12 2z"/>
      </svg>
      <div class="brandText"><span>itz</span><b>Smoke</b><strong>Point</strong></div>
      <span class="adminTag">Admin</span>
    </div>
  </div>
  <span aria-hidden="true"></span>
</div>
</header>
<main class="wrap" id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uzkusblmtvzjvulbgdav.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_91jwR0u0DBVBLT0PxpmVFQ_yhpnxbLO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<script>
const TABLE_PRODUCTS="store_products", TABLE_SETTINGS="store_settings", TABLE_BRANDS="store_brands";
let ps=[], brandsList=[], currentSession=null;
const mainEl=document.getElementById("main");

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function pFind(id){return ps.find(p=>p.id===id)}
function bFind(id){return brandsList.find(b=>b.id===id)}
function cardEl(id){return document.querySelector(`.pcard[data-id="${id}"]`)}
function brandRowEl(id){return document.querySelector(`.brandRow[data-id="${id}"]`)}

async function init(){
  const {data}=await supabaseClient.auth.getSession();
  currentSession=data.session;
  if(!currentSession){showLogin();return}
  await mountApp();
}
function showLogin(){
  mainEl.innerHTML=`<section class="panel authPanel">
  <h2>Acceso administrador</h2>
  <p class="hint">Ingresá el correo y contraseña del administrador.</p>
  <div class="authForm">
    <input id="loginEmail" type="email" placeholder="Correo">
    <input id="loginPassword" type="password" placeholder="Contraseña">
    <button class="primary" onclick="login()">Entrar</button>
    <div id="loginMsg" class="hint"></div>
  </div>
  </section>`;
}
async function login(){
  const email=loginEmail.value.trim(),password=loginPassword.value;
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){loginMsg.textContent=error.message;return}
  currentSession=data.session;location.reload();
}
async function logout(){await supabaseClient.auth.signOut();location.reload()}

function renderShell(){
  mainEl.innerHTML=`
  <div class="toolbar">
    <button class="primary" onclick="addProduct()">＋ Agregar producto</button>
    <input id="search" class="searchInput" placeholder="Buscar producto..." oninput="filterCards()">
    <button class="secondary" onclick="window.open('index.html','_blank')">Abrir catálogo</button>
    <button class="secondary" onclick="refreshAll()">Actualizar</button>
    <button class="secondary" onclick="logout()">Cerrar sesión</button>
  </div>
  <section class="panel">
    <h3>Configuración</h3>
    <div class="settingsGrid">
      <div class="settingField">
        <label>WhatsApp<input id="wa" placeholder="549..." inputmode="numeric"></label>
        <div class="fieldActions"><button class="primary" onclick="saveWA()">Guardar</button><button class="secondary" onclick="removeWA()">Quitar</button></div>
      </div>
      <div class="settingField">
        <label>Instagram<input id="ig" placeholder="https://instagram.com/tuusuario"></label>
        <div class="fieldActions"><button class="primary" onclick="saveIG()">Guardar</button><button class="secondary" onclick="removeIG()">Quitar</button></div>
      </div>
    </div>
    <p class="hint">El WhatsApp arma el mensaje del carrito. El Instagram aparece como ícono en la tienda.</p>
  </section>
  <section class="panel">
    <h3>Marcas / líneas de producto</h3>
    <p class="hint" style="margin-top:0">Agrupá tus productos por marca (ej. "Ice King"). Podés fijar un precio y aplicarlo a todos los productos de esa línea de una sola vez.</p>
    <div id="brandsList" class="brandsList"></div>
    <div class="brandsFoot"><button class="primary" onclick="addBrand()">＋ Agregar línea</button></div>
    <datalist id="brandNamesList"></datalist>
  </section>
  <div class="summary" id="summary"></div>
  <div class="pgrid" id="pgrid"></div>`;
}

async function mountApp(){
  renderShell();
  [ps,brandsList]=await Promise.all([getProducts(),getBrands()]);
  renderBrands();
  renderProducts();
  await loadSettings();
}
async function refreshAll(){
  [ps,brandsList]=await Promise.all([getProducts(),getBrands()]);
  renderBrands();
  renderProducts();
  await loadSettings();
  flashToast("Actualizado.");
}
async function getProducts(){
  const {data,error}=await supabaseClient.from(TABLE_PRODUCTS).select("*").order("created_at",{ascending:true});
  if(error){alert(error.message);return []} return data||[];
}
async function getBrands(){
  const {data,error}=await supabaseClient.from(TABLE_BRANDS).select("*").order("sort_order",{ascending:true});
  if(error){alert(error.message);return []} return data||[];
}
async function loadSettings(){
  const {data,error}=await supabaseClient.from(TABLE_SETTINGS).select("*").eq("id",true).maybeSingle();
  if(error){console.error(error);return}
  if(wa)wa.value=data?.whatsapp||"";
  if(ig)ig.value=data?.instagram||"";
}

function renderSummary(){
  const el=document.getElementById("summary");
  if(!el)return;
  const total=ps.length,activos=ps.filter(p=>p.active!==false).length,agotados=ps.filter(p=>Number(p.stock)<=0).length;
  el.textContent=total?`${total} producto${total===1?"":"s"} · ${activos} visible${activos===1?"":"s"} · ${agotados} agotado${agotados===1?"":"s"}`:"Todavía no cargaste productos.";
}

function brandOptions(selectedId){
  let opts=`<option value="" ${!selectedId?"selected":""}>Sin marca</option>`;
  opts+=brandsList.map(b=>`<option value="${b.id}" ${selectedId===b.id?"selected":""}>${esc(b.name)}</option>`).join("");
  return opts;
}
async function updateProductBrand(id,typedName){
  const name=typedName.trim();
  const p=pFind(id);if(!p)return;
  if(!name){
    if(p.brand_id)await updateField(id,"brand_id",null);
    return;
  }
  let b=brandsList.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
  if(!b){
    const {data,error}=await supabaseClient.from(TABLE_BRANDS).insert({name,price:Number(p.price)||0,active:true,sort_order:brandsList.length}).select().single();
    if(error){alert(error.message);return}
    b=data;
    brandsList.push(b);
    renderBrands();
  }
  if(p.brand_id===b.id)return;
  await updateField(id,"brand_id",b.id);
}
async function updateProductPrice(id,rawValue){
  const p=pFind(id);if(!p)return;
  const price=Math.max(0,Number(rawValue)||0);
  const prev=p.price;
  p.price=price;
  const {error}=await supabaseClient.from(TABLE_PRODUCTS).update({price}).eq("id",id);
  if(error){p.price=prev;alert(error.message);return}
  flashSaved(id);
  if(!p.brand_id)return;
  const siblings=ps.filter(x=>x.brand_id===p.brand_id && x.id!==id);
  const b=bFind(p.brand_id);
  const [r1,r2]=await Promise.all([
    supabaseClient.from(TABLE_BRANDS).update({price}).eq("id",p.brand_id),
    siblings.length?supabaseClient.from(TABLE_PRODUCTS).update({price}).eq("brand_id",p.brand_id).neq("id",id):Promise.resolve({error:null})
  ]);
  if(r1.error){alert(r1.error.message);return}
  if(r2.error){alert(r2.error.message);return}
  if(b){
    b.price=price;
    const row=brandRowEl(b.id);
    if(row){const input=row.querySelector(".f-brandprice");if(input)input.value=price}
  }
  if(
