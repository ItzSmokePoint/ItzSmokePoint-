<style>
:root{
  --bg:#08080b;--card:#111118;--card2:#17151e;--text:#f6f3fa;--muted:#aaa4b5;
  --purple:#9b5dff;--purple2:#7134c7;--border:#2b2637;--ok:#9de0b0;--danger:#ff9292
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
html{scroll-behavior:auto}
body{
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse 60% 32% at 50% -6%,rgba(137,79,226,.18),transparent 68%),
    radial-gradient(ellipse 40% 30% at 82% 78%,rgba(174,138,245,.05),transparent 72%),
    #08080b;
  background-attachment:fixed;
}
*{-webkit-tap-highlight-color:transparent}
button{font:inherit;-webkit-tap-highlight-color:transparent;outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
a{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:auto;padding:0 18px}

body::before,body::after{
  content:"";
  position:fixed;
  inset:-15%;
  z-index:-1;
  pointer-events:none;
  mix-blend-mode:screen;
  will-change:transform;
}
body::before{
  background:
    radial-gradient(ellipse 30% 50% at 20% 25%, rgba(225,218,240,.14), transparent 70%),
    radial-gradient(ellipse 24% 44% at 82% 15%, rgba(200,190,225,.11), transparent 72%),
    radial-gradient(ellipse 34% 55% at 55% 85%, rgba(190,175,220,.10), transparent 74%),
    radial-gradient(ellipse 22% 40% at 12% 78%, rgba(210,200,235,.09), transparent 72%);
  animation:smokeDrift1 55s ease-in-out infinite;
}
body::after{
  background:
    radial-gradient(ellipse 26% 46% at 70% 55%, rgba(195,182,225,.10), transparent 74%),
    radial-gradient(ellipse 20% 38% at 35% 40%, rgba(215,207,235,.08), transparent 72%),
    radial-gradient(ellipse 28% 48% at 88% 82%, rgba(180,166,220,.08), transparent 74%);
  animation:smokeDrift2 70s ease-in-out infinite reverse;
}
@keyframes smokeDrift1{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(4%,-3%,0) scale(1.06)}
}
@keyframes smokeDrift2{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(-5%,4%,0) scale(1.05)}
}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

@media(prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes popIn{
  0%{opacity:0;transform:scale(.92)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes cartBump{
  0%,100%{transform:scale(1)}
  35%{transform:scale(1.18)}
  60%{transform:scale(.94)}
}
@keyframes badgePop{
  0%{transform:scale(1)}
  40%{transform:scale(1.35)}
  100%{transform:scale(1)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;transition-delay:0s!important}
}

header{
  position:sticky;top:0;z-index:30;
  background:rgba(10,9,14,.62);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid transparent;
  transition:border-color .25s ease, box-shadow .25s ease, background .25s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:rgba(8,8,11,.97)}
}
header.scrolled{
  border-bottom-color:var(--border);
  box-shadow:0 10px 24px rgba(0,0,0,.28);
  background:rgba(10,9,14,.82);
}
.nav{min-height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}

.navIcon{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
  border:0;background:transparent;color:var(--text);
  border-radius:50%;
  cursor:pointer;
  text-decoration:none;
  transition:background .15s ease, transform .12s ease;
}
.navIcon:hover{background:rgba(155,93,255,.12)}
.navIcon:active{transform:scale(.92)}
.navIcon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navCart{justify-self:end}
.navIg{justify-self:start;visibility:hidden}
.navCart .navBadge{
  position:absolute;top:1px;right:0;
  min-width:17px;height:17px;padding:0 4px;
  background:var(--purple);color:#fff;
  border-radius:99px;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.navCart.bump{animation:cartBump .35s ease}
.navCart .navBadge.pop{animation:badgePop .35s ease}

main{padding:26px 0 70px}
main.view-enter{animation:fadeSlideIn .32s ease both}
.notice{border:1px solid #49366c;background:rgba(21,16,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#d9cdf0;border-radius:15px;padding:14px 16px;margin-bottom:24px}
h1{font-size:32px;margin:10px 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
#app>h1,#app>.sub{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}

.chips{
  display:flex;gap:9px;overflow-x:auto;padding:2px 2px 22px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(46,40,62,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--muted);
  font-weight:800;font-size:13px;
  padding:9px 18px;border-radius:99px;
  cursor:pointer;white-space:nowrap;
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.chip:hover{border-color:rgba(178,132,255,.5);color:#fff}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--purple);border-color:var(--purple);color:#fff}

.card{
  content-visibility:auto;
  contain-intrinsic-size:320px 430px;
  background:linear-gradient(145deg,rgba(46,40,62,.5),rgba(16,15,22,.55));
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:19px;
  padding:15px;
  min-width:0;
  box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;
  flex-direction:column;
  height:100%;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .5s ease, transform .5s cubic-bezier(.22,.9,.32,1), border-color .2s ease;
  transition-delay:calc(var(--i, 0) * 60ms);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:linear-gradient(145deg,rgba(35,30,47,.94),rgba(12,12,18,.97))}
}
.card.in-view{opacity:1;transform:translateY(0)}
.card:hover,.card:focus-within{
  border-color:rgba(178,132,255,.5);
  transform:translateY(-4px);
}
.card.in-view:active{transform:translateY(-1px) scale(.99)}
.photo{
  position:relative;
  height:235px;
  border-radius:13px;
  background:linear-gradient(145deg,rgba(8,8,13,.95),rgba(22,18,31,.82));
  border:1px solid rgba(255,255,255,.045);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.brandTag{
  position:absolute;top:9px;left:9px;z-index:2;
  background:rgba(20,16,30,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(178,132,255,.4);
  color:#e4d6ff;
  font-size:10.5px;font-weight:800;letter-spacing:.3px;
  padding:4px 10px;border-radius:99px;
  text-transform:uppercase;
}
.detail .brandTag{top:14px;left:14px}
.photo img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .3s ease}
.card:hover .photo img{transform:scale(1.06)}
.placeholder{color:#70697d}
.card h2{
  font-size:19px;
  line-height:1.2;
  margin:14px 0 7px;
  min-height:3.6em;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.price{font-size:23px;font-weight:900;margin:8px 0}
.muted{color:var(--muted)}
.status{
  display:inline-flex;align-items:center;gap:6px;width:max-content;
  font-size:12px;font-weight:800;
  padding:4px 10px;border-radius:99px;
  background:rgba(120,220,160,.14);color:#8be8ab;border:1px solid rgba(120,220,160,.32);
}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.status.off{background:rgba(255,110,110,.13);color:#ff9c9c;border-color:rgba(255,110,110,.32)}
.buy{
  width:100%;
  margin-top:auto;
  border:0;
  border-radius:11px;
  background:var(--purple);
  color:#fff;
  padding:12px;
  font-weight:800;
  cursor:pointer;
  transition:box-shadow .18s ease, background .18s ease, transform .12s ease;
}
.buy:hover{background:#a76dff;box-shadow:0 8px 20px rgba(155,93,255,.35)}
.buy:active{transform:scale(.97);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.buy:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

.hidden{display:none!important}
.back{display:inline-block;color:#d9c9f4;text-decoration:none;margin-bottom:18px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.detail .photo{height:470px}
.detailBox{
  background:linear-gradient(145deg,rgba(22,21,30,.55),rgba(15,15,21,.6));
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:20px;
  padding:22px;
  box-shadow:0 12px 32px rgba(0,0,0,.20);
  animation:fadeSlideIn .4s ease both;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .detailBox{background:linear-gradient(145deg,rgba(17,17,24,.97),rgba(13,13,20,.99))}
}
.detail .photo{animation:fadeSlideIn .4s ease both}
.qty button,.line button{transition:background .15s ease, transform .1s ease}
.qty button:active,.line button:active{transform:scale(.9)}
.detailBox h1{font-size:34px}
.features{padding:0;margin:18px 0}
.feature{padding:11px 0;border-bottom:1px solid var(--border)}
.purchase{
  margin-top:20px;padding:17px;
  background:rgba(15,14,20,.5);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
}
.qty{display:flex;align-items:center;gap:12px;margin:12px 0}
.qty button,.line button{border:1px solid var(--border);background:var(--card2);color:#fff;border-radius:8px;cursor:pointer}
.qty button{width:40px;height:40px;font-size:20px}
.qty strong{min-width:25px;text-align:center}

.drawerShade{
  position:fixed;inset:0;background:#0009;z-index:50;
  display:flex;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.drawerShade.open{opacity:1;pointer-events:auto}
.drawer{
  position:absolute;right:0;top:0;height:100%;width:min(460px,100%);
  background:rgba(13,12,18,.72);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-left:1px solid rgba(255,255,255,.08);padding:18px;overflow:auto;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.22,.9,.32,1);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .drawer{background:#0e0e14}
}
.drawerShade.open .drawer{transform:translateX(0)}
.line{animation:fadeSlideIn .28s ease both}
.drawerHead{display:flex;align-items:center;justify-content:space-between}
.close{background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}
.line{display:grid;grid-template-columns:58px 1fr auto;gap:11px;padding:14px 0;border-bottom:1px solid var(--border)}
.line img,.line .mini{width:58px;height:58px;object-fit:contain;background:#08080b;border-radius:8px}
.line h3{font-size:15px;margin:0 0 4px}
.line button{width:27px;height:27px}
.lineControls{display:flex;align-items:center;gap:7px;margin-top:8px}
.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:20px 0}
.secondary{width:100%;background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:11px;padding:12px;font-weight:800;cursor:pointer;margin-bottom:9px}
.empty{text-align:center;color:var(--muted);padding:55px 10px}

.brandHero{display:flex;justify-content:center;align-items:center;text-align:center;overflow:visible}
.brandWrap{display:inline-flex;flex-direction:column;align-items:center;animation:brandFloat 4.8s ease-in-out infinite}
.brandFlame{width:20px;height:20px;fill:var(--purple);margin-bottom:1px;transform-origin:50% 90%;animation:flameFlicker 1.7s ease-in-out infinite}
.brandText{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;transform:skewX(-8deg)}
.brandText span,.brandText b,.brandText strong{
  font-family:'Anton',Impact,'Arial Narrow',sans-serif;
  font-size:clamp(26px,7vw,50px);
  font-weight:400;
  letter-spacing:.5px;
  display:inline-block;
}
.brandText span{color:#fff;animation:brandIn .55s cubic-bezier(.22,.9,.32,1) both}
.brandText b{color:var(--purple);position:relative;margin:0 2px;animation:brandIn .55s cubic-bezier(.22,.9,.32,1) .08s both}
.brandText b::after{
  content:"";
  position:absolute;left:2%;right:2%;bottom:6%;height:55%;
  background:var(--purple);
  filter:blur(16px);
  opacity:.3;
  z-index:-1;
  animation:glowPulse 3.4s ease-in-out infinite;
}
.brandText strong{color:#fff;animation:brandIn .55s cubic-bezier(.22,.9,.32,1) .16s both}
@keyframes brandIn{
  from{opacity:0;transform:translateY(-16px) rotate(-6deg)}
  to{opacity:1;transform:translateY(0) rotate(0)}
}
@keyframes brandFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-3px) rotate(-.6deg)}
}
@keyframes flameFlicker{
  0%,100%{transform:scale(1) rotate(0deg);opacity:.85}
  50%{transform:scale(1.1) rotate(3deg);opacity:1}
}
@keyframes glowPulse{0%,100%{opacity:.22}50%{opacity:.45}}

.locationMini{display:flex;width:max-content;max-width:calc(100% - 30px);margin:0 auto 25px;padding:8px 18px;align-items:center;justify-content:center;text-align:center;color:#e9ddff;background:rgba(23,16,33,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #55357e;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.2px;box-shadow:0 7px 22px rgba(0,0,0,.14)}

@media(max-width:720px){
  .wrap{padding:0 13px}
  .nav{min-height:72px;gap:6px}
  .navIcon{width:36px;height:36px}
  .navIcon svg{width:20px;height:20px}
  .detail{grid-template-columns:1fr}
  .detail .photo{height:330px}
  .detailBox{padding:17px}
  .detailBox h1{font-size:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .card{padding:10px;border-radius:15px}
  .photo{height:175px}
  .card h2{font-size:16px}
  .price{font-size:19px}
  .buy{padding:10px}
  .notice{font-size:14px}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:240px}}

#storeLoading{

  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important;

#storeLoading .loaderTitle{

}
#storeLoading .loaderBar span{
  display:block;

@keyframes loadingSlide{
  0%{transform:translateX(-140%)}

}
@media(prefers-reduced-motion:reduce){
  #storeLoading .loaderBar span{animation:none;width:100%}

html.storeLoadingLock,body.storeLoadingLock{
  overflow:hidden !important;
  overscroll-behavior:none !important;
  touch-action:none !important;
}
</style>

</head>

let hasLoadedBrands=false;
let activeBrandId=null;

function money(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const PRODUCTS_CACHE_KEY="itzsmokepoint_products_v4";
const PRODUCTS_CACHE_TTL=5*60*1000;

function readProductsCache(){
  try{
    const raw=localStorage.getItem(PRODUCTS_CACHE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.data))return null;
    return parsed;
  }catch(e){return null}
}

function writeProductsCache(data){
  try{
    localStorage.setItem(PRODUCTS_CACHE_KEY,JSON.stringify({
      savedAt:Date.now(),
      data:data||[]
    }));
  }catch(e){}
}

function hideStoreLoading(){
  const el=document.getElementById("storeLoading");
  if(!el)return;
  el.classList.add("hidden");
  document.documentElement.classList.remove("storeLoadingLock");
  document.body.classList.remove("storeLoadingLock");
  setTimeout(()=>el.remove(),220);
}

async function products(){
  const cached=readProductsCache();
  const fresh=cached && (Date.now()-cached.savedAt<PRODUCTS_CACHE_TTL);

  // Repeat visit: render cached products immediately.
  if(cached && Array.isArray(cached.data)){
    cachedProducts=cached.data;
    hasLoadedProducts=true;
    if(fresh)return cachedProducts;
  }

  // First visit / stale cache: fetch from Supabase.
  const {data,error}=await supabaseClient
    .from(TABLE_PRODUCTS)
    .select("*, brand:store_brands(id,name)")
    .eq("active",true)
    .order("created_at",{ascending:true});

  if(error){
    console.error("Supabase store_products:",error);
    return cachedProducts;
  }

  cachedProducts=data||[];
  hasLoadedProducts=true;
  writeProductsCache(cachedProducts);
  return cachedProducts;
}
async function brands(){
  if(hasLoadedBrands) return cachedBrands;
  const {data,error}=await supabaseClient
    .from(TABLE_BRANDS)
    .select("*")
    .eq("active",true)
    .order("sort_order",{ascending:true});
  if(error){console.error("Supabase store_brands:",error); return cachedBrands}
  cachedBrands=data||[];
  hasLoadedBrands=true;
  return cachedBrands;
}
async function settings(){
  if(hasLoadedSettings) return cachedSettings;
  const {data,error}=await supabaseClient.from(TABLE_SETTINGS).select("*").eq("id",true).maybeSingle();
  if(error){console.error(error); return cachedSettings}
  cachedSettings=data||{};
  hasLoadedSettings=true;
  return cachedSettings;
}
async function applyInstagramLink(){
  try{
    const s=await settings();
    const link=(s.instagram||"").trim();
    const el=document.getElementById("navIg");
    if(el && link){el.href=link;el.style.visibility="visible";}
  }catch(e){}
}
function getCart(){try{return JSON.parse(sessionStorage.getItem("itz_cart")||"{}")}catch(e){return {}}}
function saveCart(c){sessionStorage.setItem("itz_cart",JSON.stringify(c));updateCount()}
function updateCount(bump){
  const el=document.getElementById("cartCount");
  if(!el)return;
  el.textContent=Object.values(getCart()).reduce((a,b)=>a+Number(b),0);
  if(bump){
    const btn=document.querySelector(".navCart");
    el.classList.remove("pop");btn?.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("pop");btn?.classList.add("bump");
  }
}
function playViewTransition(){
  app.classList.remove("view-enter");
  void app.offsetWidth;
  app.classList.add("view-enter");
}

const cardObserver=("IntersectionObserver" in window) ? new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("in-view");
      cardObserver.unobserve(e.target);
    }
  });
},{rootMargin:"0px 0px -8% 0px",threshold:.05}) : null;

function observeCards(){
  app.querySelectorAll(".card").forEach(el=>{
    cardObserver ? cardObserver.observe(el) : el.classList.add("in-view");
  });
}

async function renderHome(){
  const [list,brandList]=await Promise.all([
    hasLoadedProducts ? cachedProducts : products(),
    hasLoadedBrands ? cachedBrands : brands()
  ]);
  const usedBrandIds=new Set(list.map(p=>p.brand_id).filter(Boolean));
  const visibleBrands=brandList.filter(b=>usedBrandIds.has(b.id));
  const filtered=activeBrandId ? list.filter(p=>p.brand_id===activeBrandId) : list;
  app.innerHTML=`<div class="locationMini">Venta solo en Goya (Ctes)</div><h1>Productos</h1><p class="sub">Elegí un producto para ver toda su información.</p>
  ${visibleBrands.length?`<div class="chips">${chipsHtml(visibleBrands)}</div>`:""}
  <section class="grid">${filtered.length?filtered.map((p,i)=>card(p,i)).join(""):`<div class="muted">${activeBrandId?"No hay productos en esta línea todavía.":"No hay productos publicados todavía."}</div>`}</section>`;
  history.replaceState({view:"home"},"","#");
  playViewTransition();
  observeCards();
}
function chipsHtml(brandList){
  const all=`<button class="chip ${activeBrandId?"":"active"}" data-brand="" onclick="selectBrand(this.dataset.brand)">Todos</button>`;
  const rest=brandList.map(b=>`<button class="chip ${activeBrandId===b.id?"active":""}" data-brand="${b.id}" onclick="selectBrand(this.dataset.brand)">${esc(b.name)}</button>`).join("");
  return all+rest;
}
function selectBrand(id){
  activeBrandId=id||null;
  renderHome();
}
function card(p,i){
const delayStep=(i||0)%3;
const brandName=p.brand?.name||"";
return `<article class="card" style="--i:${delayStep}"><div class="photo">${brandName?`<span class="brandTag">${esc(brandName)}</span>`:""}${p.image?`<img src="${p.image}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:`<span class="placeholder">Sin imagen</span>`}</div>
<h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div>
<div class="status ${p.stock>0?"":"off"}">${p.stock>0?"Disponible":"Agotado"}</div>
<button class="buy" ${p.stock>0?"":"disabled"} onclick="showProduct('${encodeURIComponent(p.id)}')">${p.stock>0?"Comprar":"Agotado"}</button></article>`
}
async function showProduct(encoded){
  const id=decodeURIComponent(encoded);
  const list=hasLoadedProducts ? cachedProducts : await products(),p=list.find(x=>x.id===id);
  if(!p){await renderHome();return}
  const brandName=p.brand?.name||"";
  app.innerHTML=`<a class="back" href="#" onclick="renderHome();return false">← Volver al catálogo</a>
  <div class="locationMini">Venta solo en Goya (Ctes)</div><div class="detail"><div class="photo">${brandName?`<span class="brandTag">${esc(brandName)}</span>`:""}${p.image?`<img src="${p.image}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:`<span class="placeholder">Sin imagen</span>`}</div>
  <section class="detailBox"><div class="status ${p.stock>0?"":"off"}">${p.stock>0?"Disponible":"Agotado"}</div>
  <h1>${esc(p.name)}</h1><div class="price">${money(p.price)}</div><p class="muted">${esc(p.description||"Sin descripción.")}</p>
  <h2>Características</h2><div class="features">${(p.features||[]).map(f=>`<div class="feature">${esc(f)}</div>`).join("")||`<div class="muted">Sin características cargadas.</div>`}</div>
  <div class="purchase"><h3>Comprar</h3><div class="muted">Seleccioná la cantidad.</div><div class="qty"><button onclick="changeDetailQty(-1)">−</button><strong id="detailQty">0</strong><button onclick="changeDetailQty(1)">+</button></div>
  <button class="buy" ${p.stock>0?"":"disabled"} onclick="addDetail('${encodeURIComponent(p.id)}')">${p.stock>0?"Agregar al carrito":"Agotado"}</button></div></section></div>`;
  window._detailQty=0;window._detailId=p.id;history.pushState({view:"product",id:p.id},"","#producto/"+encodeURIComponent(p.id));
  playViewTransition();
  window.scrollTo({top:0,behavior:"smooth"});
}
function changeDetailQty(d){
  const p=(hasLoadedProducts ? cachedProducts : []).find(x=>x.id===window._detailId);
  window._detailQty=Math.max(0,Math.min((window._detailQty||0)+d,p?p.stock:0));
  detailQty.textContent=window._detailQty;
}
function addDetail(encoded){
  const list=hasLoadedProducts ? cachedProducts : [];
  const p=list.find(x=>x.id===decodeURIComponent(encoded));
  if(!p||!window._detailQty)return;
  let c=getCart();
  c[p.id]=Math.min((c[p.id]||0)+window._detailQty,p.stock);
  saveCart(c);
  updateCount(true);
  openCart();
}
function openCart(){shade.classList.add("open");renderCart()}
function closeCart(){shade.classList.remove("open")}
function renderCart(){
  const c=getCart(),list=hasLoadedProducts ? cachedProducts : [],entries=Object.entries(c).map(([id,q])=>({p:list.find(x=>x.id===id),q:Number(q)})).filter(x=>x.p&&x.q>0);
  if(!entries.length){cartLines.innerHTML='<div class="empty">El carrito está vacío.</div>';cartBottom.innerHTML="";return}
  cartLines.innerHTML=entries.map(x=>`<div class="line">${x.p.image?`<img src="${x.p.image}" alt="" loading="lazy" decoding="async">`:`<div class="mini"></div>`}<div><h3>${esc(x.p.name)}</h3><div>${money(x.p.price)}</div><div class="lineControls"><button onclick="cartChange('${encodeURIComponent(x.p.id)}',-1)">−</button><b>${x.q}</b><button onclick="cartChange('${encodeURIComponent(x.p.id)}',1)">+</button></div></div><b>${money(x.p.price*x.q)}</b></div>`).join("");
  const total=entries.reduce((s,x)=>s+x.p.price*x.q,0);
  cartBottom.innerHTML=`<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="secondary" onclick="closeCart()">Continuar comprando</button><button class="buy" onclick="checkout()">Finalizar por WhatsApp</button>`;
}
function cartChange(encoded,d){
  const id=decodeURIComponent(encoded),list=hasLoadedProducts ? cachedProducts : [],p=list.find(x=>x.id===id),c=getCart();if(!p)return;
  c[id]=Math.max(0,Math.min((c[id]||0)+d,p.stock));if(!c[id])delete c[id];saveCart(c);renderCart()
}
async function checkout(){
  const c=getCart(),list=hasLoadedProducts ? cachedProducts : await products(),entries=Object.entries(c).map(([id,q])=>({p:list.find(x=>x.id===id),q:Number(q)})).filter(x=>x.p&&x.q);
  if(!entries.length)return;
  const s=await settings(),n=(s.whatsapp||"").replace(/\D/g,"");
  if(!n){alert("El número de WhatsApp todavía no está configurado.");return}
  const total=entries.reduce((sum,x)=>sum+x.p.price*x.q,0),lines=entries.map(x=>`• ${x.q}x ${x.p.name} — ${money(x.p.price*x.q)}`).join("\n");
  const msg=`Hola, quiero hacer un pedido para Goya, Corrientes:\n\n${lines}\n\nTotal: ${money(total)}`;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,"_blank");
}


async function bootStore(){
  document.documentElement.classList.add("storeLoadingLock");
  document.body.classList.add("storeLoadingLock");
  applyInstagramLink();
  try{
    await route();
  }finally{
    requestAnimationFrame(()=>requestAnimationFrame(hideStoreLoading));
  }
}
async function route(){let h=location.hash;if(h.startsWith("#producto/"))await showProduct(h.slice(10));else await renderHome()}
window.addEventListener("popstate",route);window.addEventListener("hashchange",route);
window.addEventListener("scroll",()=>{
  document.querySelector("header")?.classList.toggle("scrolled",window.scrollY>4);
},{passive:true});
updateCount();bootStore();
</script>
</body>
</html>
