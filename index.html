<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>itzSmoke Point</title>
<style>
:root{--bg:#08080b;--card:#111118;--card2:#17151e;--text:#f6f3fa;--muted:#aaa4b5;--purple:#9b5dff;--purple2:#7134c7;--border:#2b2637;--ok:#9de0b0;--danger:#ff9292}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
body{background:radial-gradient(circle at 50% -10%,#21143c 0,#0b0910 30%,#08080b 65%);overflow-x:hidden}
button{font:inherit}.wrap{max-width:1080px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:30;background:rgba(8,8,11,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--purple)}
.cartBtn,.primary{border:0;background:var(--purple);color:#fff;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px #7134c733}.cartBtn:hover,.primary:hover{background:#a76dff}
.badge{background:#fff;color:#6025ae;border-radius:99px;padding:2px 7px;margin-left:5px}
main{padding:26px 0 70px}.notice{border:1px solid #49366c;background:#151020;color:#d9cdf0;border-radius:15px;padding:14px 16px;margin-bottom:24px}
h1{font-size:32px;margin:10px 0 6px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:linear-gradient(145deg,#121119,#0f0f14);border:1px solid var(--border);border-radius:19px;padding:15px;min-width:0;box-shadow:0 12px 40px #0003}.photo{height:235px;border-radius:13px;background:#09090d;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{color:#70697d}.card h2{font-size:19px;margin:14px 0 7px}.price{font-size:23px;font-weight:900;margin:8px 0}.muted{color:var(--muted)}.status{font-size:13px;color:var(--ok)}.status.off{color:var(--danger)}.buy{width:100%;margin-top:13px;border:0;border-radius:11px;background:var(--purple);color:#fff;padding:12px;font-weight:800;cursor:pointer}.buy:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}.back{display:inline-block;color:#d9c9f4;text-decoration:none;margin-bottom:18px}.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.detail .photo{height:470px}.detailBox{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}.detailBox h1{font-size:34px}.features{padding:0;margin:18px 0}.feature{padding:11px 0;border-bottom:1px solid var(--border)}.purchase{margin-top:20px;padding:17px;background:#0b0b10;border:1px solid var(--border);border-radius:15px}.qty{display:flex;align-items:center;gap:12px;margin:12px 0}.qty button,.line button{border:1px solid var(--border);background:var(--card2);color:#fff;border-radius:8px;cursor:pointer}.qty button{width:40px;height:40px;font-size:20px}.qty strong{min-width:25px;text-align:center}
.drawerShade{position:fixed;inset:0;background:#0009;z-index:50;display:none}.drawerShade.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(460px,100%);background:#0e0e14;border-left:1px solid var(--border);padding:18px;overflow:auto}.drawerHead{display:flex;align-items:center;justify-content:space-between}.close{background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.line{display:grid;grid-template-columns:58px 1fr auto;gap:11px;padding:14px 0;border-bottom:1px solid var(--border)}.line img,.line .mini{width:58px;height:58px;object-fit:contain;background:#08080b;border-radius:8px}.line h3{font-size:15px;margin:0 0 4px}.line button{width:27px;height:27px}.lineControls{display:flex;align-items:center;gap:7px;margin-top:8px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:20px 0}.secondary{width:100%;background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:11px;padding:12px;font-weight:800;cursor:pointer;margin-bottom:9px}.empty{text-align:center;color:var(--muted);padding:55px 10px}
@media(max-width:720px){.wrap{padding:0 13px}.nav{min-height:72px}.brand{font-size:22px}.detail{grid-template-columns:1fr}.detail .photo{height:330px}.detailBox{padding:17px}.detailBox h1{font-size:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:10px;border-radius:15px}.photo{height:175px}.card h2{font-size:16px}.price{font-size:19px}.buy{padding:10px}.notice{font-size:14px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:240px}}

.brandHero{width:100%;display:flex;justify-content:center;align-items:center;text-align:center;animation:brandFloat 5s ease-in-out infinite}
.brandHero>div{position:relative;display:inline-flex;align-items:baseline;letter-spacing:-2.5px}
.brandHero span{color:#f6f3fa;font-size:clamp(39px,9vw,62px);font-weight:900}
.brandHero b{color:var(--purple);font-size:clamp(43px,10vw,68px);font-weight:900}
.brandHero small{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);font-size:8px;line-height:1;letter-spacing:5px;color:#aaa4b5;font-weight:700}
@keyframes brandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.locationMini{display:flex;width:max-content;max-width:calc(100% - 30px);margin:0 auto 25px;padding:8px 18px;align-items:center;justify-content:center;text-align:center;color:#e9ddff;background:#171021;border:1px solid #55357e;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.2px;box-shadow:0 7px 22px #0003}
.floatingCart{position:fixed;right:17px;bottom:18px;z-index:40;width:62px;height:62px;border:1px solid #b88cff;background:var(--purple);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 10px 35px #0009;cursor:pointer}
.floatingCart svg{display:block;width:29px;height:29px;margin:0;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.floatingCart .badge{position:absolute;right:-2px;top:-5px;background:#fff;color:#6025ae;border-radius:50%;width:23px;height:23px;padding:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1;text-align:center}
</style>
</head>
<body>
<header>
<div class="wrap nav">
  <div class="brandHero"><div><span>itz</span><b>Smoke</b><small>POINT</small></div></div>
</div>
</header>

<main class="wrap" id="app"></main>
<button class="floatingCart" onclick="openCart()" aria-label="Abrir carrito">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M3.5 5h2l1.8 9.1a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 1.9-1.5L20.5 8H6.3"/>
<circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
</svg><span class="badge" id="cartCount">0</span></button>

<div class="drawerShade" id="shade" onclick="if(event.target===this)closeCart()">
<aside class="drawer">
<div class="drawerHead"><h2>Tu carrito</h2><button class="close" onclick="closeCart()">✕</button></div>
<div id="cartLines"></div><div id="cartBottom"></div>
</aside>
</div>

<script>
const FALLBACK=[{id:"demo-1",name:"Producto de ejemplo",price:0,stock:0,limit:0,image:"",active:true,description:"Agregá productos desde Admin.",features:[]}];

function products(){try{let x=JSON.parse(localStorage.getItem("itz_products"));return Array.isArray(x)?x:FALLBACK}catch(e){return FALLBACK}}
function settings(){try{return JSON.parse(localStorage.getItem("itz_settings")||"{}")}catch(e){return {}}}
function money(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function getCart(){try{return JSON.parse(sessionStorage.getItem("itz_cart")||"{}")}catch(e){return {}}}
function saveCart(c){sessionStorage.setItem("itz_cart",JSON.stringify(c));updateCount()}
function updateCount(){cartCount.textContent=Object.values(getCart()).reduce((a,b)=>a+Number(b),0)}

function card(p){
return `<article class="card"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:`<span class="placeholder">Sin imagen</span>`}</div>
<h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div>
<div class="status ${p.stock>0?"":"off"}">${p.stock>0?"Disponible":"Agotado"}</div>
<button class="buy" ${p.stock>0?"":"disabled"} onclick="showProduct('${encodeURIComponent(p.id)}')">${p.stock>0?"Comprar":"Agotado"}</button></article>`
}
function renderHome(){
const list=products().filter(p=>p.active!==false);
app.innerHTML=`<div class="locationMini">Venta solo en Goya (Ctes)</div><h1>Productos</h1><p class="sub">Elegí un producto para ver toda su información.</p>
<section class="grid">${list.length?list.map(card).join(""):`<div class="muted">No hay productos publicados todavía.</div>`}</section>`;
history.replaceState({view:"home"},"","#");
}
function showProduct(encoded){
const id=decodeURIComponent(encoded),p=products().find(x=>x.id===id);
if(!p){renderHome();return}
app.innerHTML=`<a class="back" href="#" onclick="renderHome();return false">← Volver al catálogo</a>
<div class="locationMini">Venta solo en Goya (Ctes)</div><div class="detail"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:`<span class="placeholder">Sin imagen</span>`}</div>
<section class="detailBox"><div class="status ${p.stock>0?"":"off"}">${p.stock>0?"Disponible":"Agotado"}</div>
<h1>${esc(p.name)}</h1><div class="price">${money(p.price)}</div><p class="muted">${esc(p.description||"Sin descripción.")}</p>
<h2>Características</h2><div class="features">${(p.features||[]).map(f=>`<div class="feature">${esc(f)}</div>`).join("")||`<div class="muted">Sin características cargadas.</div>`}</div>
<div class="purchase"><h3>Comprar</h3><div class="muted">Seleccioná la cantidad.</div><div class="qty"><button onclick="changeDetailQty(-1)">−</button><strong id="detailQty">0</strong><button onclick="changeDetailQty(1)">+</button></div>
<button class="buy" ${p.stock>0?"":"disabled"} onclick="addDetail('${encodeURIComponent(p.id)}')">${p.stock>0?"Agregar al carrito":"Agotado"}</button></div></section></div>`;
window._detailQty=0;window._detailId=p.id;history.pushState({view:"product",id:p.id},"","#producto/"+encodeURIComponent(p.id));
}
function changeDetailQty(d){let p=products().find(x=>x.id===window._detailId);window._detailQty=Math.max(0,Math.min((window._detailQty||0)+d,p?p.stock:0));detailQty.textContent=window._detailQty}
function addDetail(encoded){let p=products().find(x=>x.id===decodeURIComponent(encoded));if(!p||!window._detailQty)return;let c=getCart();c[p.id]=Math.min((c[p.id]||0)+window._detailQty,p.stock);saveCart(c);openCart()}
function openCart(){shade.classList.add("open");renderCart()}
function closeCart(){shade.classList.remove("open")}
function renderCart(){
const c=getCart(), entries=Object.entries(c).map(([id,q])=>({p:products().find(x=>x.id===id),q:Number(q)})).filter(x=>x.p&&x.q>0);
if(!entries.length){cartLines.innerHTML='<div class="empty">El carrito está vacío.</div>';cartBottom.innerHTML="";return}
cartLines.innerHTML=entries.map(x=>`<div class="line">${x.p.image?`<img src="${x.p.image}" alt="">`:`<div class="mini"></div>`}<div><h3>${esc(x.p.name)}</h3><div>${money(x.p.price)}</div><div class="lineControls"><button onclick="cartChange('${encodeURIComponent(x.p.id)}',-1)">−</button><b>${x.q}</b><button onclick="cartChange('${encodeURIComponent(x.p.id)}',1)">+</button></div></div><b>${money(x.p.price*x.q)}</b></div>`).join("");
const total=entries.reduce((s,x)=>s+x.p.price*x.q,0);
cartBottom.innerHTML=`<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="secondary" onclick="closeCart()">Continuar comprando</button><button class="buy" onclick="checkout()">Finalizar por WhatsApp</button>`;
}
function cartChange(encoded,d){let id=decodeURIComponent(encoded),p=products().find(x=>x.id===id),c=getCart();if(!p)return;c[id]=Math.max(0,Math.min((c[id]||0)+d,p.stock));if(!c[id])delete c[id];saveCart(c);renderCart()}
function checkout(){
let c=getCart(),entries=Object.entries(c).map(([id,q])=>({p:products().find(x=>x.id===id),q:Number(q)})).filter(x=>x.p&&x.q);
if(!entries.length)return;
let n=(settings().whatsapp||"").replace(/\D/g,"");if(!n){alert("Configurá primero el número de WhatsApp desde Admin.");return}
let total=entries.reduce((s,x)=>s+x.p.price*x.q,0),lines=entries.map(x=>`• ${x.q}x ${x.p.name} — ${money(x.p.price*x.q)}`).join("\n");
let msg=`Hola, quiero hacer un pedido para Goya, Corrientes:\n\n${lines}\n\nTotal: ${money(total)}`;
window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,"_blank");
}
function route(){let h=location.hash;if(h.startsWith("#producto/"))showProduct(h.slice(10));else renderHome()}
window.addEventListener("popstate",route);window.addEventListener("hashchange",route);window.addEventListener("storage",route);
updateCount();route();
</script>
</body>
</html>
<style>@media(max-width:720px){.locationMini{margin-left:auto;margin-right:auto}.floatingCart{right:16px;bottom:17px;width:60px;height:60px}.floatingCart svg{width:28px;height:28px}}</style>
